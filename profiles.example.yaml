# Boot profile config for ipxe-presign.
#
# Each key under profiles matches a client TLS certificate commonName.
# A booting node whose certificate carries CN "worker-profile" gets the
# script rendered from the matching profile below. Unmatched clients
# receive a bare "#!ipxe / exit" script.
profiles:
  worker-profile:
    kernel_url: "https://minio.internal:9000/boot-assets/fcos/vmlinuz"
    initrd_urls:
      - "https://minio.internal:9000/boot-assets/fcos/initramfs.img"
    ignition_s3_resource: "ignition/worker.ign"
    rootfs_s3_resource: "fcos/worker-rootfs.img"
    kargs:
      - "console=tty0"
      - "console=ttyS0,115200n8"
      - "ignition.firstboot"
      - "ignition.platform.id=metal"
